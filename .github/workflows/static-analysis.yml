name: Static Analysis

on:
  pull_request:
    branches:
      - v4
  push:
    branches:
      - v4

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Composer validate and PHPStan
    if: github.repository_owner == 'aws'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PHP 8.2 is the lowest supported version, so PHPStan flags code that
      # newer-only syntax or APIs would break.
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
          extensions: curl, dom, mbstring, openssl, simplexml, xmlwriter, zlib

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer static-analysis
