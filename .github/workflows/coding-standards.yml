name: Coding Standards

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  coding-standards:
    runs-on: ubuntu-latest
    name: PHPCS
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
          php-version: '8.1'

      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed source files
        id: changed-source-files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            DIFF_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          else
            DIFF_BASE="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [[ -z "$DIFF_BASE" || "$DIFF_BASE" == "0000000000000000000000000000000000000000" ]]; then
            DIFF_BASE="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi

          git diff --name-only --diff-filter=ACMRT "$DIFF_BASE" "$HEAD_SHA" -- '*.php' \
            | grep -E '^src/' \
            | grep -v '^src/data/' > changed-source-files.txt || true

          if [[ -s changed-source-files.txt ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            cat changed-source-files.txt
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No changed source files to check."
          fi

      - name: Install PHP_CodeSniffer
        if: steps.changed-source-files.outputs.has_files == 'true'
        run: composer require --dev squizlabs/php_codesniffer "^3.10" --no-interaction --prefer-dist --no-progress --update-with-all-dependencies

      - name: Run PHP_CodeSniffer
        if: steps.changed-source-files.outputs.has_files == 'true'
        shell: bash
        run: |
          echo "::group::PHPCS violations"
          set +e
          xargs vendor/bin/phpcs --standard=phpcs.xml.dist --basepath="$(pwd)" --no-colors < changed-source-files.txt 2>&1 | tee phpcs-report.txt
          phpcs_exit=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"

          if [[ "$phpcs_exit" -ne 0 ]]; then
            echo ""
            echo "PHPCS detected formatting violations."
            echo ""
            echo "Files and lines to fix:"
            awk '
              /^FILE: / {
                file = $0
                sub(/^FILE: /, "", file)
                next
              }
              /^[[:space:]]*[0-9]+[[:space:]]+\|[[:space:]]+ERROR[[:space:]]+\|/ {
                line = $1
                message = $0
                sub(/^[[:space:]]*[0-9]+[[:space:]]+\|[[:space:]]+ERROR[[:space:]]+\|[[:space:]]+/, "", message)
                print "- " file ":" line " - " message
              }
              /^[[:space:]]+\|[[:space:]]+\|[[:space:]]+/ && file != "" {
                continuation = $0
                sub(/^[[:space:]]+\|[[:space:]]+\|[[:space:]]+/, "", continuation)
                print "  " continuation
              }
            ' phpcs-report.txt
            echo ""
            echo "To apply automatic PHPCS fixes locally, run this from the repository root:"
            echo "phpcbf --standard=phpcs.xml.dist \\"
            sed 's/^/  /; $!s/$/ \\/' changed-source-files.txt
            echo ""

            echo "::group::Preview after running PHPCBF"
            echo "This diff shows the file contents after PHPCBF applies automatic fixes in the CI checkout."
            echo ""
            set +e
            xargs vendor/bin/phpcbf --standard=phpcs.xml.dist < changed-source-files.txt
            phpcbf_exit=$?
            set -e

            if [[ "$phpcbf_exit" -ne 0 ]]; then
              echo ""
              echo "PHPCBF could not fix every violation automatically. The diff below shows the changes it could apply."
              echo ""
            fi

            if git diff --quiet -- $(cat changed-source-files.txt); then
              echo "PHPCBF did not produce automatic changes for these violations."
            else
              git diff -- $(cat changed-source-files.txt)
            fi
            echo "::endgroup::"

            exit "$phpcs_exit"
          fi
