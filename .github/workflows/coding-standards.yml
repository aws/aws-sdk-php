name: Coding Standards

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  coding-standards:
    runs-on: ubuntu-latest
    name: PHPCS
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          coverage: none
          php-version: '8.2'

      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed source files
        id: changed-source-files
        shell: bash
        run: bash .github/scripts/find-changed-source-files.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}

      - name: Install PHP_CodeSniffer
        if: steps.changed-source-files.outputs.has_files == 'true' || steps.changed-source-files.outputs.coding_standards_changed == 'true'
        run: composer require --dev squizlabs/php_codesniffer "^3.10" --no-interaction --prefer-dist --no-progress --update-with-all-dependencies

      - name: Test custom PHP_CodeSniffer rules
        if: steps.changed-source-files.outputs.coding_standards_changed == 'true'
        shell: bash
        run: bash .github/scripts/test-phpcs-sniffs.sh

      - name: Run PHP_CodeSniffer
        if: steps.changed-source-files.outputs.has_files == 'true'
        shell: bash
        run: bash .github/scripts/run-phpcs.sh
