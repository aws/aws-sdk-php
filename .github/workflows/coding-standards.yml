name: Coding Standards

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  coding-standards:
    runs-on: ubuntu-latest
    name: PHPCS
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
          php-version: '8.1'

      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed middleware files
        id: changed-middleware-files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi

          git diff --name-only --diff-filter=ACMRT "$BASE_SHA" HEAD -- '*.php' \
            | grep -E '^src/.*Middleware\.php$' \
            | grep -v '^src/data/' > changed-middleware-files.txt || true

          if [[ -s changed-middleware-files.txt ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            cat changed-middleware-files.txt
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No changed middleware files to check."
          fi

      - name: Install PHP_CodeSniffer
        if: steps.changed-middleware-files.outputs.has_files == 'true'
        run: composer require --dev squizlabs/php_codesniffer "^3.10" --no-interaction --prefer-dist --no-progress --update-with-all-dependencies

      - name: Run PHP_CodeSniffer
        if: steps.changed-middleware-files.outputs.has_files == 'true'
        run: xargs vendor/bin/phpcs --standard=phpcs.xml.dist < changed-middleware-files.txt