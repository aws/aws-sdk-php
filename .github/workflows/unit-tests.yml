name: Unit Tests

on:
  pull_request:
    branches:
      - v4
  push:
    branches:
      - v4

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.os }})
    if: github.repository_owner == 'aws'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # PHP 8.6 is a nightly build from the PHP-8.6 branch; it may fail without
    # blocking the workflow until 8.6 is released.
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: curl, dom, mbstring, openssl, simplexml, xmlwriter, zlib

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit
